<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#7C3AED" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Glow orb top-right -->
  <circle cx="950" cy="120" r="280" fill="url(#glow)"/>

  <!-- Glow orb bottom-left -->
  <circle cx="250" cy="500" r="200" fill="#06B6D4" opacity="0.05"/>

  <!-- Logo mark -->
  <g transform="translate(80, 60)">
    <!-- Hexagon -->
    <path d="M28 4 L52 18 V46 L28 60 L4 46 V18 Z" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <!-- Inner shape -->
    <path d="M20 32 V24 L28 21 L36 24 V32 L28 35 Z" stroke="#06B6D4" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Brand name -->
  <text x="152" y="82" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="32" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
    Rod<tspan fill="#A78BFA">Sanc</tspan><tspan fill="#22D3EE">Techs</tspan>
  </text>

  <!-- Tagline -->
  <text x="152" y="108" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" fill="#94A3B8" letter-spacing="0.5">
    ESTUDIO DE DESARROLLO DE SOFTWARE
  </text>

  <!-- Accent line -->
  <rect x="80" y="140" width="120" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Main headline -->
  <text x="80" y="220" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
    Software a Medida
  </text>
  <text x="80" y="280" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
    para Empresas
  </text>

  <!-- Service pills -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="90" height="36" rx="18" fill="#7C3AED" opacity="0.15" stroke="#7C3AED" stroke-width="1"/>
    <text x="45" y="23" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="middle">ERP</text>

    <rect x="105" y="0" width="90" height="36" rx="18" fill="#7C3AED" opacity="0.15" stroke="#7C3AED" stroke-width="1"/>
    <text x="150" y="23" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="middle">CRM</text>

    <rect x="210" y="0" width="90" height="36" rx="18" fill="#7C3AED" opacity="0.15" stroke="#7C3AED" stroke-width="1"/>
    <text x="255" y="23" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="middle">POS</text>

    <rect x="315" y="0" width="140" height="36" rx="18" fill="#7C3AED" opacity="0.15" stroke="#7C3AED" stroke-width="1"/>
    <text x="385" y="23" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="middle">E-commerce</text>

    <rect x="470" y="0" width="130" height="36" rx="18" fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
    <text x="535" y="23" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#22D3EE" text-anchor="middle">Fintech</text>

    <rect x="615" y="0" width="130" height="36" rx="18" fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
    <text x="680" y="23" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#22D3EE" text-anchor="middle">Móvil</text>
  </g>

  <!-- Trust line -->
  <text x="80" y="410" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="16" fill="#64748B">
    9+ años de experiencia  ·  Venezuela  ·  Respuesta en menos de 24 h
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="#0F172A" opacity="0.8"/>
  <line x1="0" y1="570" x2="1200" y2="570" stroke="url(#accent)" stroke-width="2"/>

  <!-- Domain -->
  <text x="80" y="607" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.5">rodsanctechs.netlify.app</text>

  <!-- Right side decorative nodes -->
  <g transform="translate(900, 200)" opacity="0.6">
    <!-- Node 1 -->
    <circle cx="0" cy="0" r="24" fill="#1E293B" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#A78BFA" text-anchor="middle">API</text>

    <!-- Node 2 -->
    <circle cx="120" cy="60" r="24" fill="#1E293B" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="120" y="65" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#A78BFA" text-anchor="middle">DB</text>

    <!-- Node 3 -->
    <circle cx="50" cy="140" r="24" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="50" y="145" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#22D3EE" text-anchor="middle">UI</text>

    <!-- Connections -->
    <line x1="22" y1="12" x2="98" y2="48" stroke="#7C3AED" stroke-width="1" opacity="0.4"/>
    <line x1="118" y1="82" x2="68" y2="122" stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <line x1="22" y1="16" x2="30" y2="122" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
